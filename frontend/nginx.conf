server {
 listen 8080;
 server_name _;
 # No revelar la versión de nginx en cabeceras ni páginas de error.
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 resolver ${DNS_RESOLVER} valid=10s ipv6=off;
 set $api_upstream ${API_UPSTREAM};
 location /api/ {
  proxy_pass http://$api_upstream;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 # Swagger UI y la documentación OpenAPI viven en el gateway.
 location ~ ^/(swagger-ui|v3/) {
  proxy_pass http://$api_upstream;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 # Rutas adicionales opcionales (por ejemplo, el S3 local de compose.emulador.yaml). Vacío en AWS.
 include /etc/nginx/extra/*.conf;
 # HTML nunca debe conservar una referencia antigua a bundles de Vite.
 # Los assets con hash siguen usando la caché normal del navegador.
 location = /index.html {
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  include /etc/nginx/seguridad.conf;
  try_files /index.html =404;
 }
 location / {
  include /etc/nginx/seguridad.conf;
  try_files $uri $uri/ /index.html;
 }
}
