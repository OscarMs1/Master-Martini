spring.application.name=mm-auth-usuarios
server.port=8080
server.address=0.0.0.0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.hikari.maximum-pool-size=5
server.error.include-message=never
app.service-key=${SERVICE_KEY}
app.catalog-url=${CATALOG_URL:http://catalogo:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-directory=${UPLOAD_DIRECTORY:/app/uploads}
# true en AWS (HTTPS): la cookie de renovación solo viaja cifrada.
app.cookie-secure=${COOKIE_SECURE:false}
app.frontend-origin=${FRONTEND_ORIGIN:http://127.0.0.1:8095,http://localhost:8095}
app.orders-url=${ORDERS_URL:http://pedidos:8080}
app.classes-url=${CLASSES_URL:http://clases-contacto:8080}
spring.servlet.multipart.enabled=false
spring.sql.init.mode=always
# Swagger / OpenAPI. SWAGGER_ENABLED=false lo apaga (por ejemplo en producción).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth-usuarios
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=catalogo
springdoc.swagger-ui.urls[1].url=/v3/servicios/catalogo
springdoc.swagger-ui.urls[2].name=pedidos
springdoc.swagger-ui.urls[2].url=/v3/servicios/pedidos
springdoc.swagger-ui.urls[3].name=clases-contacto
springdoc.swagger-ui.urls[3].url=/v3/servicios/clases-contacto
springdoc.swagger-ui.persist-authorization=true
# JWT para la app móvil (HS256). JWT_SECRET: al menos 32 caracteres.
app.jwt-secret=${JWT_SECRET}
app.jwt-minutos=${JWT_MINUTOS:15}
# Días que dura el token de renovación (inicio de sesión recordado).
app.refresh-dias=${REFRESH_DIAS:7}
