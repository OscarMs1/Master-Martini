spring.application.name=mm-auth-usuarios
server.port=8080
server.address=0.0.0.0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.hikari.maximum-pool-size=5
server.error.include-message=never
app.service-key=${SERVICE_KEY}
app.catalog-url=${CATALOG_URL:http://catalogo:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-directory=${UPLOAD_DIRECTORY:/app/uploads}
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.frontend-origin=${FRONTEND_ORIGIN:http://127.0.0.1:8095,http://localhost:8095}
app.orders-url=${ORDERS_URL:http://pedidos:8080}
app.classes-url=${CLASSES_URL:http://clases-contacto:8080}
spring.servlet.multipart.enabled=false
spring.sql.init.mode=always
server.servlet.session.cookie.name=JSESSIONID
