spring.application.name=master-martini-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/master_martini?serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:master_martini}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.frontend-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5173}
app.seed-enabled=${SEED_ENABLED:true}
app.admin-email=${ADMIN_EMAIL:admin@demo.local}
app.admin-password=${ADMIN_PASSWORD:}
server.error.include-message=never

app.upload-directory=${UPLOAD_DIRECTORY:.local/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
