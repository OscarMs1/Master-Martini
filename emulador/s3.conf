# S3 local (AWS Emulator) para pruebas. Solo se carga con compose.emulador.yaml.
# El navegador y el catálogo llegan al bucket por esta misma dirección, así no hace falta CORS
# y la CSP (connect-src 'self') sigue igual. nginx verifica el certificado del emulador.
location /mm-media {
 # Igual que la bucket policy de AWS: se lee sin firma solo imagenes/ y videos/; todo lo demás
 # (subir, borrar, listar) necesita firma SigV4 en la URL (subida firmada) o en Authorization.
 set $firmado "";
 if ($arg_X-Amz-Signature) { set $firmado 1; }
 if ($http_authorization ~ "^AWS4-HMAC-SHA256 ") { set $firmado 1; }
 set $permitido $firmado;
 if ($request_method ~ ^(GET|HEAD)$) { set $permitido "${permitido}lectura"; }
 if ($uri ~ ^/mm-media/(imagenes|videos)/[A-Za-z0-9._-]+$) { set $permitido "${permitido}medio"; }
 if ($permitido = "") { return 403; }
 if ($permitido = "lectura") { return 403; }
 if ($permitido = "medio") { return 403; }
 set $emulador aws-emulator:9297;
 proxy_pass https://$emulador;
 proxy_ssl_verify on;
 proxy_ssl_trusted_certificate /etc/nginx/extra/.local/ca.pem;
 proxy_ssl_name localhost;
 proxy_ssl_server_name on;
 # El Host forma parte de la firma SigV4: se reenvía sin cambios.
 proxy_set_header Host $http_host;
 proxy_request_buffering off;
 client_max_body_size 210m;
}
